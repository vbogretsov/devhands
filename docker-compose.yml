services:
  postgres:
    extends:
      file: postgres/docker-compose.yml
      service: postgres
  postgres-exporter:
    extends:
      file: postgres/docker-compose.yml
      service: postgres-exporter
  redis:
    extends:
      file: redis/docker-compose.yml
      service: redis
  redis-exporter:
    extends:
      file: redis/docker-compose.yml
      service: redis-exporter
  nginx:
    extends:
      file: nginx/docker-compose.yml
      service: nginx
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    tty: false
    volumes:
      - ./tls/nginx.pem:/etc/nginx/certs/cert.pem
      - ./tls/nginx-key.pem:/etc/nginx/certs/key.pem
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  nginx-exporter:
    extends:
      file: nginx/docker-compose.yml
      service: nginx-exporter
  app-1:
    extends:
      file: apps/app/docker-compose.yml
      service: app-1
    ports:
      - 8080:8000
  prometheus:
    extends:
      file: prometheus/docker-compose.yml
      service: prometheus
  node-exporter:
    extends:
      file: prometheus/docker-compose.yml
      service: node-exporter
  grafana:
    extends:
      file: grafana/docker-compose.yml
      service: grafana
  wrk:
    build: wrk
    profiles:
      - manual
    volumes:
      - ./wrk/src:/src
      - ./wrk/data:/data
  wrkx:
    build: wrkx
    profiles:
      - manual
    volumes:
      - ./wrk/src:/src
      - ./wrk/data:/data
  k6:
    image: grafana/k6:0.58.0
    profiles:
      - manual
    volumes:
      - ./k6:/src


volumes:
  postgres: {}
  redis: {}
  prometheus: {}

networks:
  macvlan:
    driver: macvlan

